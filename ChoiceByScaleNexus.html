<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergent AI Task Portal</title>
  <style>
    :root {
      --primary-color: #00897b;
      --primary-gradient: linear-gradient(135deg, #00897b, #004d40);
      --bg-color: #f4f7f6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .portal-card {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    .header {
      background: var(--primary-gradient);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 13px;
      opacity: 0.9;
    }
    .iframe-container {
      width: 100%;
      height: 75vh; /* आपकी ऑफर साइट को पूरा दिखाने के लिए */
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<div class="portal-card">
  <div class="header">
    <h1>Verified Task Portal</h1>
    <p>Complete the offer below to verify</p>
  </div>
  <div class="iframe-container">
    <iframe src="https://offer.pathakcpa.in/campaign/p25lzt"></iframe>
  </div>
</div>

</body>
</html>
