<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent AI - Rewards Hub</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: #1b263b;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid #ff0055;
        }
        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 3px solid #ff0055;
            box-shadow: 0 0 20px #ff0055;
        }
        h1 { margin: 10px 0 5px 0; color: #fff; }
        .live-badge {
            display: inline-block;
            background-color: #ff0055;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 0 15px #ff0055;
            margin-bottom: 20px;
        }
        .reward-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #38bdf8;
            margin-bottom: 20px;
        }
        .reward-amount {
            font-size: 50px;
            font-weight: 900;
            color: #34d399;
            text-shadow: 0 0 20px #34d399;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label { display: block; margin-bottom: 8px; color: #e2e8f0; font-weight: bold; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        .redirect-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(16,185,129,0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app-container">
    <img src="https://cdn.phototourl.com/member/2026-11-10-225d6421-bb82-4388-8815-101a13b5856b.webp" class="brand-logo" alt="Logo">
    <h1>EMERGENT AI</h1>
    <div class="live-badge">● LIVE</div>

    <div class="reward-card">
        <div>Total Assured Cashback</div>
        <div class="reward-amount">₹300</div>
    </div>

    <div class="input-group">
        <label>Enter Campaign Registered UPI ID</label>
        <input type="text" placeholder="example@upi">
    </div>

    <a href="https://moneyhuntersback-dev.github.io/Scale-Nexus-/Moneyhunteraitask.html" class="redirect-btn">
        CONFIRM & START TASK →
    </a>
</div>

</body>
</html>
