<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent AI - Rewards Hub</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0d1b2a; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: #1b263b; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .brand-info { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 50px; height: 50px; border-radius: 12px; border: 3px solid #ff0055; object-fit: cover; }
        .brand-text h1 { margin: 0; font-size: 18px; font-weight: 800; }
        .brand-text p { margin: 2px 0 0 0; font-size: 11px; color: #ff85a1; text-transform: uppercase; }
        .live-badge { background-color: #ff0055; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 8px; height: 8px; background-color: #fff; border-radius: 50%; }
        .verified-banner { background: linear-gradient(90deg, #10b981, #059669); text-align: center; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; }
        .reward-card { background: radial-gradient(circle, #1a2f4d 0%, #0d1a2e 100%); border: 2px solid #38bdf8; border-radius: 16px; padding: 25px 15px; text-align: center; margin-bottom: 25px; }
        .reward-title { font-size: 14px; font-weight: 800; color: #fbbf24; text-transform: uppercase; margin-bottom: 8px; }
        .reward-amount { font-size: 64px; font-weight: 900; color: #34d399; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .input-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #e2e8f0; }
        .input-wrapper { position: relative; display: flex; align-items: center; background-color: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 12px; }
        .upi-input { flex: 1; background: transparent; border: none; color: #ffffff; font-size: 18px; outline: none; }
        .submit-btn { width: 100%; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; padding: 20px; font-size: 18px; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand-info">
            <img src="https://cdn.phototourl.com/member/2026-11-10-225d6421-bb82-4388-8815-101a13b5856b.webp" class="brand-logo" alt="Brand">
            <div class="brand-text">
                <h1>EMERGENT AI</h1>
                <p>Task Portal</p>
            </div>
        </div>
        <div class="live-badge">
            <div class="live-dot"></div> LIVE
        </div>
    </div>

    <div class="verified-banner">Verified Campaign</div>

    <div class="reward-card">
        <div class="reward-title">Total Assured Cashback</div>
        <div class="reward-amount">₹300</div>
    </div>

    <form id="trackingForm">
        <div class="form-group">
            <label class="input-label">Enter Campaign Registered UPI ID</label>
            <div class="input-wrapper">
                <input type="text" id="upi_id" name="upi_id" class="upi-input" placeholder="example@upi" required autocomplete="off">
            </div>
        </div>
        <button type="submit" id="submitBtn" class="submit-btn">CONFIRM & START TASK →</button>
    </form>
</div>

<script>
    document.getElementById('trackingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const upiId = document.getElementById('upi_id').value;
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'PROCESSING...';

        // 
        const trackingUrl = 'https://offer.pathakcpa.in/campaign/htlbu2';
        
        try {
            // बैकग्राउंड में ट्रैकिंग लिंक पर रिक्वेस्ट भेजें
            await fetch(trackingUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: new URLSearchParams({ 'upi_id': upiId })
            });
        } catch (error) {
            console.log('Tracking request sent.');
        }

        // इसके बाद डेस्टिनेशन पेज पर रीडायरेक्ट करें
        window.location.href = 'https://moneyhuntersback-dev.github.io/Scale-Nexus-/EmergentAITask.html';
    });
</script>

</body>
</html>
